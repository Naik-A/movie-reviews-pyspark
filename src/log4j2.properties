status = error
name = SparkQuiet

# Root stays at warn so Spark does not print its own "Setting default log level" line.
# Noisy startup loggers are pinned to error below.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %p %m%n

logger.sparkutil.name = org.apache.spark.util
logger.sparkutil.level = error
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = error
logger.jetty.name = org.eclipse.jetty
logger.jetty.level = error
logger.sparkjetty.name = org.sparkproject.jetty
logger.sparkjetty.level = error
